# Which uptermd relay pairing sessions go through. Fill this in once for your
# team (see the README's "Running your own relay") and commit it: every
# installer reads it, and `pair` uses it on every session.

# Hostname or IP of your relay, and uptermd's SSH port on it.
RELAY_HOST=""
RELAY_PORT="2222"

# The relay's SSH host public key (key type + base64 blob), pinned into
# known_hosts so an impersonated relay fails hard instead of prompting.
# deploy.sh prints this line at the end; to read it yourself:
#   ssh-keyscan -p 2222 -t ed25519 <relay-host>    (drop the leading host part)
# Verify it from a second network before committing it.
RELAY_HOST_KEY=""
